<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棉花记 - 统计</title>
<style>
  :root {
    --cream: #faf6f0;
    --cream-dark: #f0e8dc;
    --cream-deeper: #e4d8c8;
    --sage: #7ba68a;
    --sage-light: #a4ccb0;
    --sage-pale: #dceee2;
    --coral: #e8856c;
    --coral-light: #f4b0a0;
    --coral-pale: #fde8e2;
    --honey: #d4a853;
    --honey-light: #e8c87a;
    --honey-pale: #fdf4dc;
    --lavender: #9b8ec4;
    --lavender-pale: #ece8f4;
    --text: #3a3028;
    --text-light: #8a7e70;
    --text-lighter: #b8aa98;
    --shadow: rgba(58,48,40,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #e8ddd0 0%, #d4c8b8 50%, #c8bcac 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'PingFang SC', -apple-system, 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    padding: 20px;
  }

  .phone {
    width: 390px;
    height: 844px;
    background: var(--cream);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 2px 4px var(--shadow), 0 8px 20px var(--shadow), 0 20px 60px rgba(58,48,40,0.12);
  }

  .phone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence baseFrequency='0.8' numOctaves='4' type='fractalNoise'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23g)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
  }

  .screen {
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  /* Header */
  .header {
    padding: 54px 24px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: fadeIn 0.5s ease-out;
  }

  .header-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }

  /* Period tabs */
  .period-tabs {
    display: flex;
    background: white;
    border-radius: 12px;
    padding: 3px;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .period-tab {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-lighter);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .period-tab.active {
    background: var(--sage);
    color: white;
  }

  /* Month selector */
  .month-selector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 12px 24px;
    animation: fadeIn 0.5s 0.05s ease-out both;
  }

  .month-arrow {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-light);
    box-shadow: 0 1px 4px var(--shadow);
  }

  .month-current {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  /* Summary row */
  .summary-row {
    display: flex;
    gap: 10px;
    padding: 0 20px;
    margin-bottom: 16px;
    animation: fadeIn 0.5s 0.1s ease-out both;
  }

  .summary-item {
    flex: 1;
    padding: 14px 12px;
    background: white;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .summary-label {
    font-size: 10px;
    color: var(--text-lighter);
    margin-bottom: 4px;
  }

  .summary-val {
    font-size: 18px;
    font-weight: 700;
  }

  .summary-val.out { color: var(--coral); }
  .summary-val.in { color: var(--sage); }
  .summary-val.net { color: var(--text); }

  /* Bar chart */
  .chart-card {
    margin: 0 20px 16px;
    padding: 18px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 16px var(--shadow);
    animation: fadeIn 0.5s 0.15s ease-out both;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .chart-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }

  .chart-legend {
    display: flex;
    gap: 12px;
    font-size: 10px;
    color: var(--text-lighter);
  }

  .legend-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 3px;
    vertical-align: middle;
  }

  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 120px;
    padding-bottom: 20px;
    position: relative;
  }

  /* Grid lines */
  .bar-chart::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 100px;
    background: repeating-linear-gradient(
      to bottom,
      var(--cream-dark) 0px,
      var(--cream-dark) 1px,
      transparent 1px,
      transparent 25px
    );
    opacity: 0.5;
  }

  .bar-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    z-index: 1;
  }

  .bar-pair {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 100%;
  }

  .bar {
    width: 14px;
    border-radius: 4px 4px 2px 2px;
    transition: height 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar.expense { background: var(--coral-light); }
  .bar.income { background: var(--sage-light); }

  .bar-label {
    font-size: 9px;
    color: var(--text-lighter);
    white-space: nowrap;
  }

  /* Donut chart */
  .donut-card {
    margin: 0 20px 16px;
    padding: 18px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 16px var(--shadow);
    animation: fadeIn 0.5s 0.2s ease-out both;
  }

  .donut-wrapper {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 12px;
  }

  .donut-svg {
    width: 110px;
    height: 110px;
    flex-shrink: 0;
  }

  .donut-center-text {
    font-size: 6px;
    font-weight: 700;
    fill: var(--text);
    dominant-baseline: central;
  }

  .donut-center-sub {
    font-size: 4px;
    fill: var(--text-lighter);
    dominant-baseline: central;
  }

  .donut-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .donut-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .donut-icon {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .donut-info { flex: 1; }

  .donut-cat-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }

  .donut-cat-pct {
    font-size: 10px;
    color: var(--text-lighter);
  }

  .donut-cat-amount {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  /* Trend card */
  .trend-card {
    margin: 0 20px 16px;
    padding: 18px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 16px var(--shadow);
    animation: fadeIn 0.5s 0.25s ease-out both;
  }

  .trend-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
  }

  .trend-row:not(:last-child) {
    border-bottom: 1px solid var(--cream-dark);
  }

  .trend-icon {
    font-size: 20px;
  }

  .trend-info { flex: 1; }

  .trend-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .trend-desc {
    font-size: 11px;
    color: var(--text-lighter);
    margin-top: 2px;
  }

  .trend-badge {
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
  }

  .trend-badge.up {
    background: var(--coral-pale);
    color: var(--coral);
  }

  .trend-badge.down {
    background: var(--sage-pale);
    color: var(--sage);
  }

  /* Bottom nav */
  .bottom-nav {
    position: sticky;
    bottom: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 16px 28px;
    background: linear-gradient(to top, var(--cream) 70%, transparent);
    z-index: 10;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    opacity: 0.35;
    transition: all 0.25s ease;
  }
  .nav-item.active { opacity: 1; }
  .nav-icon { font-size: 20px; }
  .nav-label { font-size: 10px; font-weight: 600; color: var(--text); }

  .nav-center {
    width: 56px;
    height: 56px;
    background: linear-gradient(145deg, #5a9468 0%, var(--sage) 50%, #8fc4a0 100%);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: -18px;
    box-shadow: 0 4px 16px rgba(123,166,138,0.35), 0 0 0 3px rgba(123,166,138,0.1);
    cursor: pointer;
  }
  .nav-center svg { width: 32px; height: 32px; } }

  .design-label {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 12px;
    color: #b8aa98;
  }
  .design-label span { display: block; font-size: 16px; font-weight: 700; color: var(--sage); margin-top: 2px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="design-label">统计<span>棉花记</span></div>

<div class="phone">
  <div class="screen">
    <div class="header">
      <div class="header-title">统计</div>
      <div class="period-tabs">
        <div class="period-tab">周</div>
        <div class="period-tab active">月</div>
        <div class="period-tab">年</div>
      </div>
    </div>

    <div class="month-selector">
      <div class="month-arrow">‹</div>
      <div class="month-current">2026年3月</div>
      <div class="month-arrow">›</div>
    </div>

    <!-- Summary -->
    <div class="summary-row">
      <div class="summary-item">
        <div class="summary-label">支出</div>
        <div class="summary-val out">¥4,827</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">收入</div>
        <div class="summary-val in">¥15,000</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">结余</div>
        <div class="summary-val net">¥10,173</div>
      </div>
    </div>

    <!-- Bar chart -->
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">每周对比</div>
        <div class="chart-legend">
          <span><span class="legend-dot" style="background:var(--coral-light)"></span>支出</span>
          <span><span class="legend-dot" style="background:var(--sage-light)"></span>收入</span>
        </div>
      </div>
      <div class="bar-chart" id="barChart"></div>
    </div>

    <!-- Donut -->
    <div class="donut-card">
      <div class="chart-header">
        <div class="chart-title">支出分类</div>
      </div>
      <div class="donut-wrapper">
        <svg class="donut-svg" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="14" fill="var(--cream)"/>
          <!-- Segments -->
          <circle cx="21" cy="21" r="16" fill="none" stroke="#e8856c" stroke-width="4"
            stroke-dasharray="37 63" stroke-dashoffset="25"
            style="transform-origin:center;transform:rotate(-90deg);"/>
          <circle cx="21" cy="21" r="16" fill="none" stroke="#d4a853" stroke-width="4"
            stroke-dasharray="34 66" stroke-dashoffset="-12"
            style="transform-origin:center;transform:rotate(-90deg);"/>
          <circle cx="21" cy="21" r="16" fill="none" stroke="#9b8ec4" stroke-width="4"
            stroke-dasharray="19 81" stroke-dashoffset="-46"
            style="transform-origin:center;transform:rotate(-90deg);"/>
          <circle cx="21" cy="21" r="16" fill="none" stroke="#7ba68a" stroke-width="4"
            stroke-dasharray="10 90" stroke-dashoffset="-65"
            style="transform-origin:center;transform:rotate(-90deg);"/>
          <text x="21" y="20" text-anchor="middle" class="donut-center-text">¥4,827</text>
          <text x="21" y="24.5" text-anchor="middle" class="donut-center-sub">总支出</text>
        </svg>
        <div class="donut-list">
          <div class="donut-item">
            <div class="donut-icon" style="background:var(--coral-pale)">🍜</div>
            <div class="donut-info">
              <div class="donut-cat-name">餐饮</div>
              <div class="donut-cat-pct">37%</div>
            </div>
            <div class="donut-cat-amount">¥1,820</div>
          </div>
          <div class="donut-item">
            <div class="donut-icon" style="background:var(--honey-pale)">🛍</div>
            <div class="donut-info">
              <div class="donut-cat-name">购物</div>
              <div class="donut-cat-pct">34%</div>
            </div>
            <div class="donut-cat-amount">¥1,628</div>
          </div>
          <div class="donut-item">
            <div class="donut-icon" style="background:var(--lavender-pale)">🎮</div>
            <div class="donut-info">
              <div class="donut-cat-name">娱乐</div>
              <div class="donut-cat-pct">19%</div>
            </div>
            <div class="donut-cat-amount">¥899</div>
          </div>
          <div class="donut-item">
            <div class="donut-icon" style="background:var(--sage-pale)">🚇</div>
            <div class="donut-info">
              <div class="donut-cat-name">交通</div>
              <div class="donut-cat-pct">10%</div>
            </div>
            <div class="donut-cat-amount">¥480</div>
          </div>
        </div>
      </div>
    </div>

    <!-- AI Trend Insights -->
    <div class="trend-card">
      <div class="chart-header" style="margin-bottom:4px;">
        <div class="chart-title">AI 洞察</div>
      </div>
      <div class="trend-row">
        <div class="trend-icon">🍜</div>
        <div class="trend-info">
          <div class="trend-title">餐饮支出偏高</div>
          <div class="trend-desc">较上月增长 18%，建议控制外卖频次</div>
        </div>
        <div class="trend-badge up">↑18%</div>
      </div>
      <div class="trend-row">
        <div class="trend-icon">🚇</div>
        <div class="trend-info">
          <div class="trend-title">交通支出正常</div>
          <div class="trend-desc">较上月减少 5%，保持得不错</div>
        </div>
        <div class="trend-badge down">↓5%</div>
      </div>
      <div class="trend-row">
        <div class="trend-icon">💡</div>
        <div class="trend-info">
          <div class="trend-title">节省建议</div>
          <div class="trend-desc">本月如减少 3 次外卖，可省约 ¥120</div>
        </div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <div class="nav-item"><span class="nav-icon">🏡</span><span class="nav-label">首页</span></div>
      <div class="nav-item active"><span class="nav-icon">📊</span><span class="nav-label">统计</span></div>
      <div class="nav-center"><svg viewBox="0 0 40 40" fill="none"><text x="20" y="26" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="18" font-weight="900" fill="white">AI</text><path d="M32 4l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#ffd700"/><path d="M7 6l0.6 1.8 1.8 0.6-1.8 0.6L7 10.8 6.4 9 4.6 8.4l1.8-0.6z" fill="white" opacity="0.5"/></svg></div>
      <div class="nav-item"><span class="nav-icon">📋</span><span class="nav-label">账单</span></div>
      <div class="nav-item"><span class="nav-icon">🌿</span><span class="nav-label">我的</span></div>
    </div>
  </div>
</div>

<script>
  const weeks = [
    { label: '第1周', expense: 65, income: 0 },
    { label: '第2周', expense: 82, income: 95 },
    { label: '第3周', expense: 50, income: 0 },
    { label: '本周', expense: 35, income: 0 },
  ];

  const chart = document.getElementById('barChart');
  weeks.forEach((w, i) => {
    const g = document.createElement('div');
    g.className = 'bar-group';

    const pair = document.createElement('div');
    pair.className = 'bar-pair';

    const eb = document.createElement('div');
    eb.className = 'bar expense';
    eb.style.height = '0px';
    setTimeout(() => eb.style.height = w.expense + 'px', 400 + i * 100);
    pair.appendChild(eb);

    const ib = document.createElement('div');
    ib.className = 'bar income';
    ib.style.height = '0px';
    if (w.income > 0) {
      setTimeout(() => ib.style.height = w.income + 'px', 400 + i * 100);
    }
    pair.appendChild(ib);

    const lbl = document.createElement('div');
    lbl.className = 'bar-label';
    lbl.textContent = w.label;

    g.appendChild(pair);
    g.appendChild(lbl);
    chart.appendChild(g);
  });
</script>

</body>
</html>
