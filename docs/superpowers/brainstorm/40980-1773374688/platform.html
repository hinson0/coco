<h2>目标平台是什么？</h2>
<p class="subtitle">这将决定技术栈选择和 UI 交互方式</p>

<div class="options">
  <div class="option" data-choice="mobile" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>📱 移动端优先（iOS / Android）</h3>
      <p>原生或跨平台 App，随手拍照识别、语音记账体验最佳</p>
    </div>
  </div>
  <div class="option" data-choice="web" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>🌐 Web 应用（浏览器）</h3>
      <p>部署简单，跨设备访问，PC 端数据录入和报表分析更方便</p>
    </div>
  </div>
  <div class="option" data-choice="both" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>📱 + 🌐 移动端 + Web 双端</h3>
      <p>移动端随手记，Web 端分析管理，数据云端同步</p>
    </div>
  </div>
  <div class="option" data-choice="desktop" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>🖥️ 桌面端（macOS / Windows）</h3>
      <p>本地运行，数据隐私，适合需要离线工作的场景</p>
    </div>
  </div>
</div>
