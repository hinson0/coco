# workflow的名字
name: Backend CI

on:
  # 触发的条件,只有在pr到main的时候触发
  pull_request:
    branches: [main]
    # 指定的路径下触发
    paths:
      - "apps/backend/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    # job的名字
    name: Ruff / Pyright / Pytest
    # 跑在ubuntu上
    runs-on: ubuntu-latest
    defaults:
      # 在这个目录下跑.意味着,下面的每个run都会在前面cd apps/backend 然后执行run
      run:
        working-directory: apps/backend

    env:
      # CI 测试用占位值（非真实密钥）
      SILICON_API_KEY: "test-placeholder"
      TENCENT_SECRET_ID: "test-placeholder"
      TENCENT_SECRET_KEY: "test-placeholder"
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
      JWT_SECRET: "test-ci-secret"

    steps:
      # 拉取代码
      - uses: actions/checkout@v4

      # 安装 uv
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # 安装 Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 安装依赖
      - run: uv sync --frozen

      # 代码质量
      - name: Ruff lint
        run: uv run ruff check .

      # 格式化
      - name: Ruff format
        run: uv run ruff format --check .

      # 类型检查
      - name: Pyright
        run: uv run pyright

      # 单测
      - name: Pytest
        run: uv run pytest -x -q
