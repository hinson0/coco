<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCR 来源选择面板 · Playground</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161920;
        --panel-2: #1f232c;
        --border: #2a2f3a;
        --text: #e6e8ec;
        --text-dim: #8a92a3;
        --accent: #7fa67f;
        --accent-dim: #4f6a4f;
        --focus: #5f86ff;
        --danger: #e08585;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
          "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.5;
      }

      .app {
        display: grid;
        grid-template-columns: 320px 1fr;
        height: 100vh;
        overflow: hidden;
      }

      /* ---------- Controls ---------- */
      .controls {
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 20px 20px 120px;
      }

      .controls h1 {
        font-size: 15px;
        margin: 0 0 4px;
        color: var(--text);
      }

      .controls .subtitle {
        color: var(--text-dim);
        font-size: 12px;
        margin-bottom: 20px;
      }

      .group {
        margin-bottom: 22px;
      }

      .group h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        margin: 0 0 10px;
        font-weight: 600;
      }

      .row {
        margin-bottom: 12px;
      }

      .row label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        margin-bottom: 6px;
        color: var(--text);
      }

      .row label .val {
        color: var(--text-dim);
        font-family: var(--mono);
        font-size: 11px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .seg {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 4px;
        background: var(--panel-2);
        border-radius: 8px;
        padding: 3px;
      }

      .seg button {
        background: transparent;
        border: 0;
        color: var(--text-dim);
        padding: 6px 4px;
        border-radius: 6px;
        cursor: pointer;
        font-family: var(--sans);
        font-size: 11px;
      }

      .seg button.active {
        background: var(--accent);
        color: #0f1115;
        font-weight: 600;
      }

      .preset-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .preset-row button {
        flex: 1;
        min-width: 70px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 6px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
      }

      .preset-row button:hover {
        border-color: var(--accent);
      }

      /* ---------- Stage ---------- */
      .stage {
        display: grid;
        grid-template-rows: 1fr auto;
        overflow: hidden;
      }

      .preview-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        padding: 24px;
        background:
          radial-gradient(
            1200px circle at 20% 20%,
            rgba(127, 166, 127, 0.12),
            transparent 45%
          ),
          radial-gradient(
            900px circle at 80% 80%,
            rgba(95, 134, 255, 0.08),
            transparent 45%
          ),
          var(--bg);
      }

      .phone {
        --w: 375px;
        width: var(--w);
        height: 680px;
        background: #faf7f0;
        border-radius: 36px;
        box-shadow:
          0 0 0 8px #222 inset,
          0 20px 60px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
        font-family: var(--sans);
        color: #333;
        transition: width 0.2s ease;
      }

      .phone .notch {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 110px;
        height: 26px;
        border-radius: 14px;
        background: #111;
        z-index: 3;
      }

      .phone .chat {
        position: absolute;
        inset: 0;
        padding: 52px 0 0;
        display: flex;
        flex-direction: column;
      }

      .phone .chat-body {
        flex: 1;
        padding: 16px 20px;
        font-size: 14px;
        color: #888;
        overflow: hidden;
      }

      .phone .bubble {
        background: #fff;
        border-radius: 14px;
        padding: 10px 14px;
        max-width: 72%;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        margin-bottom: 10px;
        font-size: 13px;
        color: #333;
      }

      .phone .bubble.me {
        background: #d7ead7;
        margin-left: auto;
      }

      /* ---------- Input bar ---------- */
      .bar {
        background: #faf7f0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px 18px;
        border-top: 1px solid rgba(0, 0, 0, 0.04);
        position: relative;
        z-index: 2;
      }

      .bar .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        font-size: 20px;
        cursor: pointer;
        user-select: none;
        background: transparent;
        border: 0;
      }

      .bar .icon-btn.plus {
        background: #7fa67f;
        color: #fff;
        font-size: 22px;
        line-height: 1;
      }

      .bar .icon-btn.camera.active {
        background: rgba(127, 166, 127, 0.18);
      }

      .bar .fake-input {
        flex: 1;
        height: 40px;
        background: #faf7f0;
        border: 1px solid #ede6d4;
        border-radius: 22px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        color: #b8ad8d;
        font-size: 14px;
      }

      /* ---------- Sheet ---------- */
      .sheet-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 72px;
        display: flex;
        justify-content: center;
        pointer-events: none;
        z-index: 1;
        padding: 0 16px;
      }

      .sheet-outside {
        position: absolute;
        inset: 0;
        background: transparent;
        pointer-events: auto;
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      .sheet {
        background: #fff;
        border-radius: 16px;
        padding: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 85%;
        max-width: 320px;
        transform: translateY(12px);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.16s ease,
          opacity 0.16s ease;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      }

      .sheet.open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .sheet.open ~ .sheet-outside,
      .phone.open .sheet-outside {
        pointer-events: auto;
      }

      .option {
        background: #faf7f0;
        border-radius: 12px;
        padding: 16px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          background 0.08s ease;
        user-select: none;
      }

      .option:hover {
        background: #f2ede1;
      }

      .option:active {
        transform: scale(0.97);
      }

      .option .emoji {
        font-size: 32px;
        line-height: 1;
      }

      .option .label {
        font-size: 14px;
        color: #333;
        font-weight: 500;
      }

      /* ---------- Toast ---------- */
      .toast {
        position: absolute;
        left: 50%;
        top: 58%;
        transform: translate(-50%, 0);
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        z-index: 5;
      }

      .toast.show {
        opacity: 1;
      }

      /* ---------- Code panel ---------- */
      .code-panel {
        background: var(--panel);
        border-top: 1px solid var(--border);
        padding: 14px 20px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: start;
      }

      .code-panel pre {
        margin: 0;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.55;
        color: #c6d4e1;
        max-height: 220px;
        overflow: auto;
        white-space: pre;
      }

      .code-panel button.copy {
        background: var(--accent);
        color: #0f1115;
        border: 0;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
        height: fit-content;
      }

      .code-panel button.copy.copied {
        background: #5f86ff;
        color: #fff;
      }

      .code-panel h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        margin: 0 0 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ============ Controls ============ -->
      <aside class="controls">
        <h1>OCR 来源选择面板</h1>
        <div class="subtitle">ChatInputBar 📷 按钮点击后弹出的悬浮卡片原型</div>

        <div class="group">
          <h2>预设</h2>
          <div class="preset-row">
            <button data-preset="default">默认</button>
            <button data-preset="soft">柔和</button>
            <button data-preset="sharp">锐利</button>
            <button data-preset="roomy">宽敞</button>
          </div>
        </div>

        <div class="group">
          <h2>卡片</h2>
          <div class="row">
            <label>圆角 <span class="val" id="val-radius"></span></label>
            <input type="range" id="radius" min="8" max="32" step="1" />
          </div>
          <div class="row">
            <label>阴影</label>
            <div class="seg" id="seg-shadow" data-key="shadow">
              <button data-v="none">none</button>
              <button data-v="sm">sm</button>
              <button data-v="md">md</button>
              <button data-v="lg">lg</button>
            </div>
          </div>
          <div class="row">
            <label>宽度占比</label>
            <div class="seg" id="seg-width" data-key="width">
              <button data-v="70">70%</button>
              <button data-v="85">85%</button>
              <button data-v="100">100%</button>
            </div>
          </div>
          <div class="row">
            <label>卡片内边距 <span class="val" id="val-padding"></span></label>
            <input type="range" id="padding" min="8" max="24" step="1" />
          </div>
        </div>

        <div class="group">
          <h2>子按钮</h2>
          <div class="row">
            <label>背景色</label>
            <div class="seg" id="seg-bg" data-key="optionBg">
              <button data-v="cream">cream</button>
              <button data-v="white">white</button>
              <button data-v="gray">gray</button>
            </div>
          </div>
          <div class="row">
            <label>Emoji 大小 <span class="val" id="val-emoji"></span></label>
            <input type="range" id="emoji" min="24" max="48" step="1" />
          </div>
          <div class="row">
            <label>标签字号 <span class="val" id="val-label"></span></label>
            <input type="range" id="label" min="12" max="18" step="1" />
          </div>
          <div class="row">
            <label>
              子按钮圆角 <span class="val" id="val-optradius"></span>
            </label>
            <input type="range" id="optradius" min="6" max="20" step="1" />
          </div>
        </div>

        <div class="group">
          <h2>视口</h2>
          <div class="row">
            <label>手机宽度</label>
            <div class="seg" id="seg-viewport" data-key="viewport">
              <button data-v="375">iPhone 375</button>
              <button data-v="414">Plus 414</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- ============ Stage ============ -->
      <main class="stage">
        <div class="preview-wrap">
          <div class="phone" id="phone">
            <div class="notch"></div>
            <div class="chat">
              <div class="chat-body">
                <div class="bubble">咖啡 30</div>
                <div class="bubble me">记一下</div>
                <div class="bubble">已记录 · 咖啡 30 元</div>
              </div>

              <div class="sheet-outside" id="sheetOutside"></div>

              <div class="sheet-layer">
                <div class="sheet" id="sheet">
                  <div class="option" data-source="camera">
                    <div class="emoji">📷</div>
                    <div class="label">拍照</div>
                  </div>
                  <div class="option" data-source="library">
                    <div class="emoji">🖼️</div>
                    <div class="label">相册</div>
                  </div>
                </div>
              </div>

              <div class="toast" id="toast"></div>

              <div class="bar">
                <button class="icon-btn camera" id="cameraBtn">📷</button>
                <div class="fake-input">记一笔或按住说话</div>
                <button class="icon-btn">🎤</button>
                <button class="icon-btn plus">+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="code-panel">
          <div>
            <h2>React Native 样式片段</h2>
            <pre id="codeOut"></pre>
          </div>
          <button class="copy" id="copyBtn">复制</button>
        </div>
      </main>
    </div>

    <script>
      // ============ State ============
      const DEFAULTS = {
        radius: 16,
        padding: 14,
        shadow: "sm",
        width: "85",
        optionBg: "cream",
        emoji: 32,
        label: 14,
        optradius: 12,
        viewport: "375",
      };

      const state = { ...DEFAULTS };

      const PRESETS = {
        default: { ...DEFAULTS },
        soft: {
          ...DEFAULTS,
          radius: 20,
          padding: 16,
          shadow: "md",
          optionBg: "cream",
          emoji: 34,
          optradius: 14,
        },
        sharp: {
          ...DEFAULTS,
          radius: 10,
          padding: 10,
          shadow: "sm",
          optionBg: "white",
          emoji: 28,
          label: 13,
          optradius: 8,
        },
        roomy: {
          ...DEFAULTS,
          radius: 18,
          padding: 20,
          shadow: "md",
          width: "100",
          emoji: 40,
          label: 16,
          optradius: 14,
        },
      };

      const SHADOWS = {
        none: "none",
        sm: "0 1px 2px rgba(0,0,0,0.06)",
        md: "0 4px 12px rgba(0,0,0,0.10)",
        lg: "0 10px 24px rgba(0,0,0,0.15)",
      };

      const OPTION_BG = {
        cream: "#FAF7F0",
        white: "#FFFFFF",
        gray: "#F1F2F4",
      };

      // ============ Render ============
      const sheet = document.getElementById("sheet");
      const phone = document.getElementById("phone");
      const toast = document.getElementById("toast");
      const codeOut = document.getElementById("codeOut");

      function render() {
        // phone width
        phone.style.width = state.viewport + "px";

        // sheet
        sheet.style.borderRadius = state.radius + "px";
        sheet.style.padding = state.padding + "px";
        sheet.style.boxShadow = SHADOWS[state.shadow];
        sheet.style.width = state.width + "%";

        // options
        sheet.querySelectorAll(".option").forEach((opt) => {
          opt.style.borderRadius = state.optradius + "px";
          opt.style.background = OPTION_BG[state.optionBg];
          opt.querySelector(".emoji").style.fontSize = state.emoji + "px";
          opt.querySelector(".label").style.fontSize = state.label + "px";
        });

        // control values
        document.getElementById("val-radius").textContent = state.radius + "px";
        document.getElementById("val-padding").textContent =
          state.padding + "px";
        document.getElementById("val-emoji").textContent = state.emoji + "px";
        document.getElementById("val-label").textContent = state.label + "px";
        document.getElementById("val-optradius").textContent =
          state.optradius + "px";

        // segmented active
        document.querySelectorAll(".seg").forEach((seg) => {
          const key = seg.dataset.key;
          seg.querySelectorAll("button").forEach((b) => {
            b.classList.toggle("active", String(state[key]) === b.dataset.v);
          });
        });

        // sliders
        document.getElementById("radius").value = state.radius;
        document.getElementById("padding").value = state.padding;
        document.getElementById("emoji").value = state.emoji;
        document.getElementById("label").value = state.label;
        document.getElementById("optradius").value = state.optradius;

        // RN snippet
        codeOut.textContent = buildRNSnippet();
      }

      function buildRNSnippet() {
        const shadowProps = buildShadow(state.shadow);
        return `// ImageSourceSheet.tsx
const styles = StyleSheet.create({
  sheet: {
    borderRadius: ${state.radius},
    padding: ${state.padding},
    backgroundColor: colors.white,
    width: "${state.width}%",
    maxWidth: 320,
    flexDirection: "row",
    gap: spacing.md,
${shadowProps}
  },
  option: {
    flex: 1,
    aspectRatio: 1.1,
    borderRadius: ${state.optradius},
    backgroundColor: ${rnBg(state.optionBg)},
    alignItems: "center",
    justifyContent: "center",
    gap: spacing.xs,
  },
  optionEmoji: {
    fontSize: ${state.emoji},
    lineHeight: ${state.emoji + 4},
  },
  optionLabel: {
    fontSize: ${state.label},
    fontWeight: "500",
    color: colors.text,
  },
});`;
      }

      function rnBg(k) {
        if (k === "cream") return "colors.cream";
        if (k === "white") return "colors.white";
        return '"#F1F2F4"';
      }

      function buildShadow(kind) {
        if (kind === "none") return "    // no shadow";
        const map = {
          sm: { o: 0.06, r: 2, y: 1, e: 2 },
          md: { o: 0.1, r: 8, y: 4, e: 4 },
          lg: { o: 0.15, r: 16, y: 10, e: 6 },
        };
        const s = map[kind];
        return (
          `    shadowColor: "#000",\n` +
          `    shadowOpacity: ${s.o},\n` +
          `    shadowRadius: ${s.r},\n` +
          `    shadowOffset: { width: 0, height: ${s.y} },\n` +
          `    elevation: ${s.e},`
        );
      }

      // ============ Interaction ============
      const cameraBtn = document.getElementById("cameraBtn");
      const outside = document.getElementById("sheetOutside");

      function setOpen(open) {
        sheet.classList.toggle("open", open);
        cameraBtn.classList.toggle("active", open);
        outside.style.opacity = open ? "1" : "0";
        outside.style.pointerEvents = open ? "auto" : "none";
      }

      cameraBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = sheet.classList.contains("open");
        setOpen(!isOpen);
      });

      outside.addEventListener("click", () => setOpen(false));

      sheet.querySelectorAll(".option").forEach((opt) => {
        opt.addEventListener("click", () => {
          const src = opt.dataset.source;
          showToast(src === "camera" ? "已选择拍照" : "已选择相册");
          setOpen(false);
        });
      });

      let toastTimer;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1200);
      }

      // sliders
      ["radius", "padding", "emoji", "label", "optradius"].forEach((k) => {
        document.getElementById(k).addEventListener("input", (e) => {
          state[k] = +e.target.value;
          render();
        });
      });

      // segmented buttons
      document.querySelectorAll(".seg").forEach((seg) => {
        seg.addEventListener("click", (e) => {
          const btn = e.target.closest("button");
          if (!btn) return;
          const key = seg.dataset.key;
          const v = btn.dataset.v;
          // viewport/width/shadow/optionBg 都是字符串
          state[key] = v;
          render();
        });
      });

      // presets
      document.querySelectorAll("[data-preset]").forEach((btn) => {
        btn.addEventListener("click", () => {
          Object.assign(state, PRESETS[btn.dataset.preset]);
          render();
          // 预览：自动开一次再关一次，让用户直观看到效果
          setOpen(true);
          setTimeout(() => setOpen(false), 1600);
        });
      });

      // copy
      const copyBtn = document.getElementById("copyBtn");
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(codeOut.textContent);
          copyBtn.textContent = "已复制";
          copyBtn.classList.add("copied");
          setTimeout(() => {
            copyBtn.textContent = "复制";
            copyBtn.classList.remove("copied");
          }, 1400);
        } catch (err) {
          copyBtn.textContent = "失败";
        }
      });

      // initial
      render();
      // 首次加载：默认打开一次，让用户看到结构
      setTimeout(() => setOpen(true), 200);
    </script>
  </body>
</html>
